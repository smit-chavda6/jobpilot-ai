name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Backend Lint & Format Check
        run: |
          ruff check apps/api
          ruff format --check apps/api

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/jobpilot
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: dev_ci_test_secret_key_at_least_32_characters_long
          FIELD_ENCRYPTION_KEY: dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGV2IQ==
          LLM_PROVIDER: mock
        run: |
          pytest apps/api/tests -v --cov=apps/api

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend Lint & Type Check
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck

      - name: Frontend Unit Tests
        working-directory: apps/web
        run: npm run test
