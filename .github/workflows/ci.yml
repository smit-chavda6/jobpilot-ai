name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jp_test" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      # Upgrade pip first: pip-audit scans the whole environment, including pip itself.
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check app tests alembic scripts && ruff format --check app tests alembic scripts
      - name: Type-check
        run: mypy app
      - name: Unit + integration tests (SQLite) with coverage
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Integration tests (Postgres 16)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/jp_test
        run: pytest -q --ignore=tests/test_migrations.py
      - name: Migrations on Postgres (upgrade / downgrade / upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/jp_test
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
          ENCRYPTION_KEY: 0Q1xKk8m1z6mX3cF4C7xg0bQ7XcH9vR2y5k3oW8sJpU=
        run: |
          psql "postgresql://postgres:test@localhost:5432/jp_test" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Matching eval (fails on regression)
        run: python ../../evals/matching/runner.py
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: API venv
        working-directory: apps/api
        run: python -m venv .venv && .venv/bin/pip install -e .
      - working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compose up (Postgres + API + worker + web)
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/readyz && break; sleep 3; done
          curl -fsS localhost:8080/api/readyz
      - name: Seed DEMO data in the stack
        run: docker compose exec -T api python -m scripts.seed_demo
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
