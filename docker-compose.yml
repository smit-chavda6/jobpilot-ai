# JobPilot AI - full stack: Postgres, API, background worker, web (nginx + SPA).
# Quickstart: cp .env.example .env && docker compose up --build  ->  http://localhost:8080
name: jobpilot

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@postgres:5432/jobpilot
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
  AI_DAILY_TOKEN_BUDGET_PER_USER: ${AI_DAILY_TOKEN_BUDGET_PER_USER:-50000}
  AI_DAILY_TOKEN_BUDGET_GLOBAL: ${AI_DAILY_TOKEN_BUDGET_GLOBAL:-1000000}
  ANALYTICS_MIN_N: ${ANALYTICS_MIN_N:-20}
  SOURCE_URL_FETCH_ENABLED: ${SOURCE_URL_FETCH_ENABLED:-true}
  SOURCE_GREENHOUSE_ENABLED: ${SOURCE_GREENHOUSE_ENABLED:-true}
  SOURCE_LEVER_ENABLED: ${SOURCE_LEVER_ENABLED:-true}
  SOURCE_ASHBY_ENABLED: ${SOURCE_ASHBY_ENABLED:-true}
  SOURCE_RSS_ENABLED: ${SOURCE_RSS_ENABLED:-true}
  FETCH_USER_AGENT: ${FETCH_USER_AGENT:-JobPilotAI/1.0 (personal job-search assistant)}
  UPLOAD_DIR: /data/uploads
  INLINE_TASKS: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
